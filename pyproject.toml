[project]
name = "sea-lion"
version = "0.1.0"
description = "AI-assisted, risk-gated, low-frequency long-only U.S. equities research/trading system (V1 MVP)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2",
  "pydantic>=2.7",
  "httpx>=0.27",
  "alpaca-py>=0.30",
  "yfinance>=0.2.50",
  "anthropic>=0.40",
  "pyyaml>=6",
  "python-dotenv>=1",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sea-lion = "sea_lion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sea_lion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
